command: ["python", "app.py"]

env:
  - name: AP_LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: AP_ARTIFACT_VOLUME_PATH
    valueFrom: artifact_volume
  - name: OMNIGENT_AUTH_PROVIDER
    value: header
  - name: OMNIGENT_BUILD_VERSION
    value: "0.10.0"
  - name: OMNIGENT_BUILD_SHA
    value: "40755dd8dddb07e1eb6e4055d1d9936e184ceb9b"
  # Auto · smart routing. Two backends: the AI Gateway routes:select router when
  # the account has it, and the built-in judge otherwise. Labs has no routing
  # API, so the external client latches off after one call and the judge serves
  # every decision — which is why this can now default true.
  - name: WORKSHOP_SMART_ROUTING
    value: "true"
  # The judge model, and the only inference the App itself performs. A Unity
  # Catalog model service, fully qualified: the App calls it through Unity AI
  # Gateway, which answers `system.ai.<model>` and not a bare name. The App
  # service principal needs EXECUTE on the service, which all account users hold
  # on `system.ai` by default — so in practice this needs no grant, where the
  # retired `databricks-gpt-5-6-luna` endpoint needed CAN_QUERY.
  - name: WORKSHOP_ROUTING_JUDGE_MODEL
    value: "system.ai.gpt-5-6-luna"
  # Optional overrides (empty = built-in defaults in smart_routing.py).
  - name: WORKSHOP_ROUTING_BASE_URL
    value: ""
  - name: WORKSHOP_ROUTING_ROUTER_NAME
    value: ""
  # Left empty on purpose: upstream's default already spans `system.ai.` and the
  # legacy `databricks-` prefix, and narrowing it here would only break the App
  # against a workspace that still serves both.
  - name: WORKSHOP_ROUTING_MODEL_PREFIXES
    value: ""
  # The judge's candidate menu, cheapest-first, and the arms it may never pick.
  # Both are comma-separated bare model ids. Here so a price change or a
  # withdrawn model is an app restart rather than a release.
  - name: WORKSHOP_ROUTING_MODEL_ORDER
    value: ""
  - name: WORKSHOP_ROUTING_MODEL_EXCLUDE
    value: ""
