command: ["python", "otel_bootstrap.py"]

env:
  # Public deployment registries; laptop transport overrides never ship here.
  - name: UV_DEFAULT_INDEX
    value: https://pypi.org/simple
  - name: PIP_INDEX_URL
    value: https://pypi.org/simple
  - name: NPM_CONFIG_REGISTRY
    value: https://registry.npmjs.org/
  - name: npm_config_registry
    value: https://registry.npmjs.org/
  - name: AP_LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: AP_ARTIFACT_VOLUME_PATH
    valueFrom: artifact_volume
  - name: OMNIGENT_AUTH_PROVIDER
    value: header
  - name: OMNIGENT_BUILD_VERSION
    value: "0.21.0"
  - name: OMNIGENT_BUILD_SHA
    value: "2f636330cc6e28bfe1d22f741eda6db34a192d39"
  # Release flags keep upstream defaults (cost page and web harness installer
  # stay off) except one: 0.21.0's default-on session_orchestration would let
  # an attendee's agent message their other sessions and start independent
  # workers. Child sub-agents, as in 0.19.1, are unaffected. Omnigent refuses
  # to start on an unknown flag name: re-check this one on every upgrade
  # (upstream reviews it in 0.22.0).
  - name: OMNIGENT_FEATURES
    value: "-session_orchestration"
  # Auto · smart routing. Two backends: the AI Gateway routes:select router when
  # the account has it, and the built-in judge otherwise. Labs has no routing
  # API, so the external client latches off after one call and the judge serves
  # every decision — which is why this can now default true.
  - name: WORKSHOP_SMART_ROUTING
    value: "true"
  # The judge model, and the only inference the App itself performs. A Unity
  # Catalog model service, fully qualified: the App calls it through Unity AI
  # Gateway, which answers `system.ai.<model>` and not a bare name. The App
  # service principal needs EXECUTE on the service, which all account users hold
  # on `system.ai` by default — so in practice this needs no grant, where the
  # retired `databricks-gpt-5-6-luna` endpoint needed CAN_QUERY.
  - name: WORKSHOP_ROUTING_JUDGE_MODEL
    value: "system.ai.gpt-5-6-luna"
  # Optional overrides (empty = built-in defaults in smart_routing.py).
  - name: WORKSHOP_ROUTING_BASE_URL
    value: ""
  - name: WORKSHOP_ROUTING_ROUTER_NAME
    value: ""
  # Left empty on purpose: upstream's default already spans `system.ai.` and the
  # legacy `databricks-` prefix, and narrowing it here would only break the App
  # against a workspace that still serves both.
  - name: WORKSHOP_ROUTING_MODEL_PREFIXES
    value: ""
  # The event's approved model pool, from Control Tower: comma-separated UC model
  # service names (e.g. system.ai.claude-opus-5-5,system.ai.gpt-6-1-sol). Matched
  # on the bare model id, so the databricks- and system.ai. spellings are the
  # same model. When set, the attendee picker, sys_list_models, the judge menu
  # and the judge itself use only these models. Empty keeps today's behaviour.
  - name: WORKSHOP_ALLOWED_MODELS
    value: ""
  # The judge's candidate menu, cheapest-first, and the arms it may never pick.
  # Both are comma-separated bare model ids. Here so a price change or a
  # withdrawn model is an app restart rather than a release.
  - name: WORKSHOP_ROUTING_MODEL_ORDER
    value: ""
  - name: WORKSHOP_ROUTING_MODEL_EXCLUDE
    value: ""
  - name: WORKSHOP_APP_URL
    value: ""
  - name: WORKSHOP_RUN_ID
    value: ""
  - name: WORKSHOP_UNIT_ID
    value: ""
  - name: EVENT_NAME
    value: ""
  - name: WORKSHOP_RELEASE_SHA
    value: ""
  # Volume floor for an App Control Tower has opted into export (it is not an
  # exporter by default). Same contract as the terminal's app.yaml.
  - name: OTEL_TRACES_SAMPLER
    value: "parentbased_traceidratio"
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "0.05"
  - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
    value: "health,/health,/healthz,/readyz,/assets/.*,/static/.*,/favicon.*"
  - name: OTEL_METRIC_EXPORT_INTERVAL
    value: "300000"
