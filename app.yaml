command:
  # This wrapper merges Control Tower identity with Databricks-provided OTel
  # resource attributes before auto-instrumentation imports the FastAPI app.
  # With telemetry disabled it execs uvicorn directly, so this release remains
  # safe before CT enables the Public Preview destination.
  - python
  - -m
  - server.otel_bootstrap

env:
  # PTY fds and session state are process-local: this app MUST run single-worker.
  - name: HOME
    value: /app/python/source_code/data/apphome

  # --- Databricks Apps telemetry identity ---
  # Databricks injects the OTLP endpoint, protocol, service name, platform
  # resource attributes, and batch settings only when telemetry is configured
  # on the App resource. Never set a collector URL or credential here.
  - name: OTEL_TRACES_SAMPLER
    value: always_on
  # Request headers are not captured by default. Keep credentials sanitized if
  # a future platform setting enables header capture for diagnostics.
  - name: OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SANITIZE_FIELDS
    value: authorization,cookie,set-cookie,x-api-key
  # FastAPI's default server spans include the URL query. These two GET routes
  # can carry attendee-authored text, so leave them out of auto-instrumentation;
  # WT's own fixed operational events remain available without that content.
  - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
    value: /api/wizard.*,/api/certificate.*
  # Control Tower patches these stable, non-PII values per seat. The startup
  # wrapper merges them into OTEL_RESOURCE_ATTRIBUTES without replacing the
  # workspace.id/app.name attributes Databricks supplied.
  - name: WORKSHOP_RUN_ID
    value: ""
  - name: WORKSHOP_UNIT_ID
    value: ""
  - name: WORKSHOP_RELEASE_SHA
    value: ""

  # --- Attendee CLI credential ---
  # PREFERRED: Databricks Apps injects the app service principal's auto-refreshing
  # OAuth credentials. The server captures them into one explicit oauth-m2m SDK
  # client, scrubs client-secret env aliases, and makes the production Linux
  # process non-dumpable before PTYs launch. Credential files receive only the
  # resulting short-lived bearer; no token API permission or PAT mint is required.
  #
  # WORKSHOP_PAT is an EMERGENCY-ONLY fallback: a vended workspace token for
  # environments without a usable app identity. It is a static credential that
  # expires with no rotation behind it, so the app reports it as "degraded" and
  # alerts. Restore direct app-identity OAuth for any large or long-lived event.
  - name: WORKSHOP_PAT
    value: ""
  # Control Tower patches this after app creation from service_principal_id.
  # It is the numeric SCIM ID used with DATABRICKS_CLIENT_ID to bind SCIM /Me.
  - name: WORKSHOP_APP_SP_ID
    value: ""

  # --- OBO dual-profile + entitlements (governance-faithful UC as the attendee) ---
  # When ENABLE_OBO is on, the app persists each attendee's forwarded
  # on-behalf-of-user token to a second databricks CLI profile (`me`) so the
  # agent can run `databricks --profile me ...` (via the `databricks-me` helper)
  # and see exactly the Unity Catalog objects the attendee is governed by. The
  # SP `[DEFAULT]` profile still powers all build/deploy/provision work.
  #
  # IMPORTANT: the OBO *scopes* are NOT set here. They live on the app resource:
  # Control Tower enables user authorization and sets `user_api_scopes` (baseline
  # `catalog.catalogs:read,catalog.schemas:read,catalog.tables:read,sql` — there
  # is NO `unity-catalog` scope; use the granular `catalog.*:read` scopes to list
  # the attendee's UC metadata + `sql` to query their data), admin-grants
  # consent, and restarts the app after a scope change. See
  # docs/control-tower-implementation.md §8.
  - name: ENABLE_OBO
    value: "false"
  # The CLI profile name backed by the OBO token (default `me`).
  - name: OBO_PROFILE_NAME
    value: "me"
  # Documentation/health hint only — must match the scopes CT set on the app
  # resource. The app cannot set its own scopes.
  - name: OBO_SCOPES
    value: "catalog.catalogs:read,catalog.schemas:read,catalog.tables:read,sql"

  # When ENABLE_ENTITLEMENTS is on, an SP-driven reconciler makes resources the
  # app SP creates usable by the attendee (labuser): ALL_PRIVILEGES on
  # WORKSHOP_CATALOG (inherited by every object created inside it) + CAN_MANAGE
  # on non-UC resources (apps/jobs/pipelines/db-instances/serving). CT must
  # provision WORKSHOP_CATALOG with the labuser as OWNER + ALL PRIVILEGES and
  # the app SP granted CREATE/USE — see docs/control-tower-implementation.md §9.
  - name: ENABLE_ENTITLEMENTS
    value: "true"
  - name: WORKSHOP_CATALOG
    value: ""
  - name: WORKSHOP_SCHEMA
    value: ""
  - name: ENTITLEMENT_RECONCILE_INTERVAL
    value: "300"
  # Off by default: grant-based ALL PRIVILEGES is enough for usability. Set true
  # only if the attendee must drop/alter SP-created UC objects as owner.
  - name: ENTITLEMENT_TRANSFER_OWNERSHIP
    value: "false"

  # --- Security (workspace groups, no allowlists) ---
  - name: ADMIN_GROUP
    value: platform_admins
  # Optional: restrict attendee access to a group (empty = any workspace user
  # the app's own permission grants admit).
  - name: ACCESS_GROUP
    value: ""
  # REQUIRED for event admission: Control Tower injects the one attendee email
  # assigned to this app instance. Attendee HTTP/WebSocket requests from any
  # other identity receive 403 unless shared topology is explicitly enabled.
  - name: WORKSHOP_ATTENDEE_EMAIL
    value: ""

  # --- Workshop insight capture (docs/workshop-insight-contract.md) ---
  # Off unless the event's registration terms cover it. When on, the app records
  # a behavioural signal, whatever use case the agent elicits, and a wrap-phase
  # summary, then buffers them for Control Tower to collect on the harvest it
  # already makes. Nothing here needs an outbound credential or an ingest URL:
  # the terminal never posts to Control Tower, because the Apps proxy in front of
  # Control Tower requires a Databricks identity the terminal cannot present.
  - name: WORKSHOP_INSIGHT_CAPTURE
    value: "false"
  # Agent-elicited discovery. Defaults on with capture; set false for signal only.
  - name: DISCOVERY_ENABLED
    value: ""
  # Model for the wrap summary. Empty falls back to quoting the attendee's own
  # words rather than inventing a narrative. A short name (`claude-haiku-4-5`) or
  # a fully-qualified model service (`system.ai.claude-haiku-4-5`) both work —
  # server/models.py qualifies a short one before it goes on the wire.
  - name: INSIGHT_SUMMARY_MODEL
    value: ""

  # --- Workshop / content steering ---
  # When the event ends, as epoch seconds. Control Tower patches it per event.
  # The `credential_durability` admission gate compares each credential plane
  # against the time left here, so leaving it empty is not neutral: the gate can
  # still catch a deployment with nothing renewing the attendee credential, but
  # a static WORKSHOP_PAT whose expiry lands mid-session becomes unanswerable
  # and is admitted. Set it for any real event.
  - name: WORKSHOP_EVENT_ENDS_AT
    value: ""
  - name: WORKSHOP_PHASE
    value: intro
  - name: CONTENT_PACK_PATH
    value: ""
  # The opening wizard: what the attendee is here to build, asked once on first
  # arrival. On by default, because an unconfigured instance should still avoid
  # dropping someone at a blinking cursor. Control Tower sets this from the
  # create form; "false" lands attendees on Home with no modal, for a format
  # that walks the room through the first build together.
  - name: WORKSHOP_ONBOARDING_WIZARD
    value: "true"
  # LLM-powered idea grid inside the opening wizard. On by default: an older
  # Control Tower that does not feed this param still gets generated cards.
  # false keeps the static catalogue (facilitated rooms, air-gapped deploys).
  - name: WORKSHOP_LLM_WIZARD
    value: "true"
  # Industry chip to preselect. Empty means the attendee chooses — never
  # silently automotive. Wins over the content pack when set. Honoured for any
  # industry the seed notebook knows (content/demo_seed_manifest.json), whether
  # or not this metastore got it: the chip steers the agent and the discovery
  # record, and only the demo tables need the data to exist.
  - name: WORKSHOP_DEFAULT_INDUSTRY
    value: ""
  # The shared read-only demo catalog, one schema per industry, seeded once per
  # metastore by Control Tower's seed/demo_data/seed_demo_data.py. Long-lived
  # and independent of any run — teardown never touches it.
  #
  # Empty means this deployment advertises no demo data: the wizard still offers
  # every industry and the agent still builds, it just generates its own
  # fixtures instead of querying ready-made ones. What empty must NOT do is
  # remove the industry question, which is what it used to do.
  #
  # The app verifies what is really behind this name before advertising any of
  # it, so a stale or unseeded value costs a missing feature rather than a
  # broken screen. Control Tower patches it per deployment.
  - name: WORKSHOP_DEMO_CATALOG
    value: "workshop_demo"
  # Pin for the wizard's model. Empty uses the wizard chain (gpt-5-4-mini, then
  # luna, haiku, gpt-oss-120b). Short or fully-qualified, as above.
  - name: WORKSHOP_WIZARD_MODEL
    value: ""
  # Coding agents offered to attendees, chosen when the workshop was created:
  # a comma-separated subset of "omnigent,claude,codex". Empty means all of
  # them. Other IDs are rejected by the server allowlist.
  - name: WORKSHOP_AGENTS
    value: ""

  # --- Skills overlay (databricks-agent-skills) ---
  # Skills are fetched once, stamped with ref + resolved commit + content
  # checksum on the persistent volume, then verified and reused on restart.
  # The reviewed default ships in assets/artifacts/manifest.json; set this only
  # to move an event to a different reviewed tag or commit SHA, never a branch
  # tip, and only alongside a matching manifest entry.
  - name: SKILLS_REF
    value: ""

  # --- Cobranding (Databricks theme when unset) ---
  - name: BRAND_NAME
    value: ""
  - name: BRAND_LOGO_URL
    value: ""
  - name: BRAND_PRIMARY_COLOR
    value: ""
  - name: EVENT_NAME
    value: ""

  # --- Model gateway / CLI defaults ---
  # Optional, and for most deployments it should stay empty. Left empty, the
  # gateway resolves to the workspace-hosted form
  # `https://<workspace-host>/ai-gateway`, which needs nothing but
  # DATABRICKS_HOST and works on every cloud and hostname shape.
  #
  # This used to be the difference between a governed event and an ungoverned
  # one: with no gateway resolved, the CLIs fell back to
  # <host>/serving-endpoints, which served every model an attendee needed. That
  # is no longer true. Databricks retired the legacy per-model endpoints in
  # favour of Unity Catalog model services (`system.ai.<model>`), and
  # /serving-endpoints/anthropic/v1/messages now answers 404 — so the gateway is
  # the only surface serving these models, and there is no fallback behind it.
  # /readyz still reports `model_gateway` as a soft check, because gating an
  # attendee out is worse than letting them in to find out, but amber here now
  # means broken rather than merely ungoverned.
  #
  # Set this only to point an event at a DEDICATED gateway subdomain. That shape
  # is materially more fragile: Omnigent cannot infer the workspace hostname
  # from it (stripping `ai-gateway.` gives an NXDOMAIN), so it falls back to
  # resolving ~/.databrickscfg DEFAULT. If that resolution fails, Omnigent
  # cannot discover models and drops the openai-completions provider entirely.
  # The workspace-hosted form has no such dependency: the gateway hostname IS
  # the workspace hostname.
  - name: DATABRICKS_GATEWAY_HOST
    value: ""
  # Also optional, and no longer a rescue lever. This auto-constructs the
  # DEDICATED-SUBDOMAIN form (https://<id>.ai-gateway.cloud.databricks.com), so
  # it inherits the .databrickscfg dependency described above, and it is probed
  # before the workspace-hosted default rather than after. Leave it empty unless
  # you specifically want that subdomain.
  - name: DATABRICKS_WORKSPACE_ID
    value: ""
  # An event's cost posture, in one word. Empty means "balanced", which is what
  # every event ran before this knob existed: a Sonnet 5 driver with Opus still
  # reachable via /model, and Codex on the balanced GPT tier.
  #
  #   economy   Caps the ceiling rather than suggesting one — Claude's Opus slot
  #             resolves to Sonnet, so /model opus costs a fifth of Opus output.
  #             Codex drops to the cheap GPT tier and the wrap summary to
  #             gpt-oss-120b. For a large free event.
  #   balanced  The default. Sonnet driver, Opus reachable, Codex balanced.
  #   frontier  Opus as the everyday driver, Codex on the flagship GPT tier. For
  #             a small paid engagement where attention costs more than tokens.
  #
  # Roles and their chains live in server/models.py; /readyz reports which
  # profile is in force and goes amber on a name this release does not know.
  - name: WORKSHOP_MODEL_PROFILE
    value: ""
  # Pins override the profile for the two roles an operator addresses directly.
  # Each leads its role's chain rather than replacing it, so a model this region
  # does not serve degrades to the best one it does rather than failing.
  #
  # Write the short name — `claude-opus-5`, `gpt-5-6-sol` — and server/models.py
  # qualifies it to `system.ai.claude-opus-5` on the wire. A fully-qualified name
  # is accepted verbatim, including a context-window variant such as
  # `system.ai.claude-sonnet-4-6[1m]` where the workspace serves one. The retired
  # `databricks-` prefix is not accepted anywhere and will not resolve.
  - name: ANTHROPIC_MODEL
    value: ""
  - name: CODEX_MODEL
    value: ""
  # Release-candidate CLI pins. Control Tower may override these only as part
  # of a reviewed event release.
  - name: CLAUDE_CODE_VERSION
    value: "2.1.237"
  - name: CODEX_CLI_VERSION
    value: "0.148.0"
  - name: DATABRICKS_CLI_VERSION
    value: "1.11.0"
  # Node 24 is the active LTS line used by Codex.
  - name: NODE_VERSION
    value: "24.18.1"
  # OPTIONAL mirror override. The reviewed contract (source + SHA-256 for every
  # installer/archive/package, plus the skills commit/content digest) ships in
  # the image at assets/artifacts/manifest.json, so boot needs nothing here.
  # A path set here may only redirect `source` per artifact -- an override that
  # changes a version or checksum is rejected, keeping the pinned set authoritative.
  - name: ARTIFACT_MANIFEST_PATH
    value: ""
  # OPTIONAL artifact mirror. When Control Tower stages the pinned toolchain
  # into a UC Volume (scripts/ct_mirror.py stage) and patches the path in here,
  # boot fetches each artifact through the Files API keyed by its manifest
  # sha256 instead of the public internet. Empty = download from source, which
  # is the default and needs no volume. Apps do not mount volumes, so this is an
  # API address, not a readable directory. Blobs are content-addressed, so a
  # version bump the volume has not been re-staged for simply misses and falls
  # back; the checksum gate is identical on both paths.
  - name: WORKSHOP_TOOLCHAIN_MIRROR_PATH
    value: ""
  # Fail an artifact install outright when the mirror cannot serve it, instead
  # of reaching the internet. For air-gapped events only.
  - name: WORKSHOP_TOOLCHAIN_MIRROR_STRICT
    value: "false"

  # --- Omnigent (agent meta-harness) ---
  # Feature flag, default ON: installs the reviewed Omnigent 0.10.0 artifact
  # set (including transitive siblings) plus tmux, then leads the catalog with
  # the Omnigent session. Set to "false" to opt out.
  - name: OMNIGENT_ENABLED
    value: "true"
  # Exact release-candidate pin, deliberately matched to the dedicated App's
  # protocol-compatible release.
  # TMUX_STATIC_URL/SHA256 are pinned in code; the env overrides below exist
  # for emergencies (e.g. GitHub release unreachable).
  - name: OMNIGENT_VERSION
    value: "0.10.0"
  # Dedicated Omnigent App URL. Empty preserves the existing local-server
  # behavior. Control Tower sets the attendee-specific HTTPS URL when remote
  # host/TUI integration is enabled.
  - name: OMNIGENT_APP_URL
    value: ""
  # Remote mode uses the instance-wide WORKSHOP_ATTENDEE_EMAIL binding above.
  # Seconds the Omnigent background runner stays alive with no active work
  # before self-terminating. Omnigent's own default is 3600 (1h), which drops
  # attendees who step away ("Runner disconnected unexpectedly"). 0 = never
  # reap the runner (default; the container lifecycle bounds it instead).
  - name: OMNIGENT_RUNNER_IDLE_TIMEOUT_S
    value: "0"
  # A host that stays alive this long is considered stable and resets its
  # supervisor crash-backoff history.
  - name: OMNIGENT_HOST_STABLE_RUNTIME_S
    value: "30"
  # Omnigent installs from the reviewed manifest only: a checksum-verified uv
  # binary, a pinned Python 3.12 runtime archive, and the in-repo fully pinned
  # --require-hashes transitive lock that anchors every wheel it resolves.
  - name: TMUX_STATIC_URL
    value: ""
  - name: TMUX_STATIC_SHA256
    value: ""

  # --- Limits ---
  - name: MAX_SESSIONS_PER_USER
    value: "1"
  - name: MAX_SESSIONS_GLOBAL
    value: "1"
  # The security boundary is one attendee per app instance. Shared topology is
  # not release-ready even when explicitly acknowledged.
  - name: ALLOW_SHARED_TOPOLOGY
    value: "false"
  # 8h: survive lunch/closed-laptop without reaping a terminal the attendee
  # stepped away from. Memory, not idle PTYs, is the real constraint here.
  - name: SESSION_IDLE_TIMEOUT_SECONDS
    value: "28800"

  # --- Session journal (restart recovery) ---
  # Set a path on the app's data volume so metadata survives a restart:
  # attendees see relaunchable "ended on restart" ghosts (live PTYs cannot
  # survive) instead of a blank screen. Raw terminal output is never persisted.
  # STRONGLY recommended for any real event.
  - name: SESSION_STATE_PATH
    value: /app/python/source_code/data/sessions.json
