command:
  - uvicorn
  - server.main:app
  - --workers
  - "1"

env:
  # PTY fds and session state are process-local: this app MUST run single-worker.
  - name: HOME
    value: /app/python/source_code/data/apphome

  # --- Attendee CLI credential ---
  # PREFERRED: Databricks Apps injects the app service principal's auto-refreshing
  # OAuth credentials. The server captures them into one explicit oauth-m2m SDK
  # client, scrubs client-secret env aliases, and makes the production Linux
  # process non-dumpable before PTYs launch. Credential files receive only the
  # resulting short-lived bearer; no token API permission or PAT mint is required.
  #
  # WORKSHOP_PAT is an EMERGENCY-ONLY fallback: a vended workspace token for
  # environments without a usable app identity. It is a static credential that
  # expires with no rotation behind it, so the app reports it as "degraded" and
  # alerts. Restore direct app-identity OAuth for any large or long-lived event.
  - name: WORKSHOP_PAT
    value: ""
  # Control Tower patches this after app creation from service_principal_id.
  # It is the numeric SCIM ID used with DATABRICKS_CLIENT_ID to bind SCIM /Me.
  - name: WORKSHOP_APP_SP_ID
    value: ""

  # --- OBO dual-profile + entitlements (governance-faithful UC as the attendee) ---
  # When ENABLE_OBO is on, the app persists each attendee's forwarded
  # on-behalf-of-user token to a second databricks CLI profile (`me`) so the
  # agent can run `databricks --profile me ...` (via the `databricks-me` helper)
  # and see exactly the Unity Catalog objects the attendee is governed by. The
  # SP `[DEFAULT]` profile still powers all build/deploy/provision work.
  #
  # IMPORTANT: the OBO *scopes* are NOT set here. They live on the app resource:
  # Control Tower enables user authorization and sets `user_api_scopes` (baseline
  # `catalog.catalogs:read,catalog.schemas:read,catalog.tables:read,sql` — there
  # is NO `unity-catalog` scope; use the granular `catalog.*:read` scopes to list
  # the attendee's UC metadata + `sql` to query their data), admin-grants
  # consent, and restarts the app after a scope change. See
  # docs/control-tower-implementation.md §8.
  - name: ENABLE_OBO
    value: "false"
  # The CLI profile name backed by the OBO token (default `me`).
  - name: OBO_PROFILE_NAME
    value: "me"
  # Documentation/health hint only — must match the scopes CT set on the app
  # resource. The app cannot set its own scopes.
  - name: OBO_SCOPES
    value: "catalog.catalogs:read,catalog.schemas:read,catalog.tables:read,sql"

  # When ENABLE_ENTITLEMENTS is on, an SP-driven reconciler makes resources the
  # app SP creates usable by the attendee (labuser): ALL_PRIVILEGES on
  # WORKSHOP_CATALOG (inherited by every object created inside it) + CAN_MANAGE
  # on non-UC resources (apps/jobs/pipelines/db-instances/serving). CT must
  # provision WORKSHOP_CATALOG with the labuser as OWNER + ALL PRIVILEGES and
  # the app SP granted CREATE/USE — see docs/control-tower-implementation.md §9.
  - name: ENABLE_ENTITLEMENTS
    value: "true"
  - name: WORKSHOP_CATALOG
    value: ""
  - name: WORKSHOP_SCHEMA
    value: ""
  - name: ENTITLEMENT_RECONCILE_INTERVAL
    value: "300"
  # Off by default: grant-based ALL PRIVILEGES is enough for usability. Set true
  # only if the attendee must drop/alter SP-created UC objects as owner.
  - name: ENTITLEMENT_TRANSFER_OWNERSHIP
    value: "false"

  # --- Security (workspace groups, no allowlists) ---
  - name: ADMIN_GROUP
    value: platform_admins
  # Optional: restrict attendee access to a group (empty = any workspace user
  # the app's own permission grants admit).
  - name: ACCESS_GROUP
    value: ""
  # REQUIRED for event admission: Control Tower injects the one attendee email
  # assigned to this app instance. Attendee HTTP/WebSocket requests from any
  # other identity receive 403 unless shared topology is explicitly enabled.
  - name: WORKSHOP_ATTENDEE_EMAIL
    value: ""

  # --- Workshop / content steering ---
  - name: WORKSHOP_PHASE
    value: intro
  - name: CONTENT_PACK_PATH
    value: ""

  # --- Skills overlay (databricks-agent-skills) ---
  # Skills are fetched once, stamped with ref + resolved commit + content
  # checksum on the persistent volume, then verified and reused on restart.
  # The reviewed default ships in assets/artifacts/manifest.json; set this only
  # to move an event to a different reviewed tag or commit SHA, never a branch
  # tip, and only alongside a matching manifest entry.
  - name: SKILLS_REF
    value: ""

  # --- Cobranding (Databricks theme when unset) ---
  - name: BRAND_NAME
    value: ""
  - name: BRAND_LOGO_URL
    value: ""
  - name: BRAND_PRIMARY_COLOR
    value: ""
  - name: EVENT_NAME
    value: ""

  # --- Model gateway / CLI defaults ---
  - name: DATABRICKS_GATEWAY_HOST
    value: ""
  # Default Claude model is Sonnet 5 (fast, capable, cheaper than Opus). Set
  # this to pin a different model per event, e.g. databricks-claude-opus-4-8
  # for a premium-tier workshop. Opus stays reachable via /model regardless.
  - name: ANTHROPIC_MODEL
    value: ""
  - name: CODEX_MODEL
    value: ""
  # Release-candidate CLI pins. Control Tower may override these only as part
  # of a reviewed event release.
  - name: CLAUDE_CODE_VERSION
    value: "2.1.216"
  - name: CODEX_CLI_VERSION
    value: "0.144.6"
  - name: DATABRICKS_CLI_VERSION
    value: "1.8.0"
  - name: NODE_VERSION
    value: "22.14.0"
  # OPTIONAL mirror override. The reviewed contract (source + SHA-256 for every
  # installer/archive/package, plus the skills commit/content digest) ships in
  # the image at assets/artifacts/manifest.json, so boot needs nothing here.
  # A path set here may only redirect `source` per artifact -- an override that
  # changes a version or checksum is rejected, keeping the pinned set authoritative.
  - name: ARTIFACT_MANIFEST_PATH
    value: ""

  # --- Omnigent (agent meta-harness) ---
  # Feature flag, default ON: installs the reviewed Omnigent 0.7.0 artifact
  # set (including transitive siblings) plus tmux, then leads the catalog with
  # the Omnigent session. Set to "false" to opt out.
  - name: OMNIGENT_ENABLED
    value: "true"
  # Exact release-candidate pin, deliberately matched to the dedicated App's
  # protocol-compatible release.
  # TMUX_STATIC_URL/SHA256 are pinned in code; the env overrides below exist
  # for emergencies (e.g. GitHub release unreachable).
  - name: OMNIGENT_VERSION
    value: "0.7.0"
  # Dedicated Omnigent App URL. Empty preserves the existing local-server
  # behavior. Control Tower sets the attendee-specific HTTPS URL when remote
  # host/TUI integration is enabled.
  - name: OMNIGENT_APP_URL
    value: ""
  # Remote mode uses the instance-wide WORKSHOP_ATTENDEE_EMAIL binding above.
  # Seconds the Omnigent background runner stays alive with no active work
  # before self-terminating. Omnigent's own default is 3600 (1h), which drops
  # attendees who step away ("Runner disconnected unexpectedly"). 0 = never
  # reap the runner (default; the container lifecycle bounds it instead).
  - name: OMNIGENT_RUNNER_IDLE_TIMEOUT_S
    value: "0"
  # A host that stays alive this long is considered stable and resets its
  # supervisor crash-backoff history.
  - name: OMNIGENT_HOST_STABLE_RUNTIME_S
    value: "30"
  # Omnigent installs from the reviewed manifest only: a checksum-verified uv
  # binary, a pinned Python 3.12 runtime archive, and the in-repo fully pinned
  # --require-hashes transitive lock that anchors every wheel it resolves.
  - name: TMUX_STATIC_URL
    value: ""
  - name: TMUX_STATIC_SHA256
    value: ""

  # --- Limits ---
  - name: MAX_SESSIONS_PER_USER
    value: "3"
  - name: MAX_SESSIONS_GLOBAL
    value: "3"
  # The security boundary is one attendee per app instance. Shared topology is
  # not release-ready even when explicitly acknowledged.
  - name: ALLOW_SHARED_TOPOLOGY
    value: "false"
  # 8h: survive lunch/closed-laptop without reaping a terminal the attendee
  # stepped away from. Memory, not idle PTYs, is the real constraint here.
  - name: SESSION_IDLE_TIMEOUT_SECONDS
    value: "28800"

  # --- Session journal (restart recovery) ---
  # Set a path on the app's data volume so metadata survives a restart:
  # attendees see relaunchable "ended on restart" ghosts (live PTYs cannot
  # survive) instead of a blank screen. Raw terminal output is never persisted.
  # STRONGLY recommended for any real event.
  - name: SESSION_STATE_PATH
    value: /app/python/source_code/data/sessions.json
