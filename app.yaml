command:
  - uvicorn
  - server.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"
  - --workers
  - "1"

env:
  # PTY fds and session state are process-local: this app MUST run single-worker.
  - name: HOME
    value: /app/python/source_code/data/apphome

  # --- Attendee CLI credential (vended by Control Tower) ---
  # A workspace token injected at deploy time (env_overrides, or replace with
  # a valueFrom secret resource). The app chains short-lived rotating tokens
  # off it when the credential can use the Token API; otherwise it serves the
  # vended token directly. Attendees never handle tokens.
  - name: WORKSHOP_PAT
    value: ""

  # --- Security (workspace groups, no allowlists) ---
  - name: ADMIN_GROUP
    value: platform_admins
  # Optional: restrict attendee access to a group (empty = any workspace user
  # the app's own permission grants admit).
  - name: ACCESS_GROUP
    value: ""

  # --- Workshop / content steering ---
  - name: WORKSHOP_PHASE
    value: intro
  - name: CONTENT_PACK_PATH
    value: ""

  # --- Skills overlay (ai-dev-kit) ---
  # Skills are fetched from ai-dev-kit at every boot. Default ref is "main"
  # (branch tip). STRONGLY pin a reviewed tag or commit SHA per event so every
  # attendee runs a known skills version (incl. the AppKit-default app skill)
  # rather than whatever lands on the branch mid-workshop.
  - name: AI_DEV_KIT_REF
    value: ""

  # --- Cobranding (Databricks theme when unset) ---
  - name: BRAND_NAME
    value: ""
  - name: BRAND_LOGO_URL
    value: ""
  - name: BRAND_PRIMARY_COLOR
    value: ""
  - name: EVENT_NAME
    value: ""

  # --- Model gateway / CLI defaults ---
  - name: DATABRICKS_GATEWAY_HOST
    value: ""
  - name: ANTHROPIC_MODEL
    value: ""
  - name: CODEX_MODEL
    value: ""

  # --- Omnigent (agent meta-harness) ---
  # Feature flag, default ON: omnigent is GA on public PyPI, so the default
  # deploy installs the latest `omnigent` (sibling deps omnigent-client /
  # omnigent-ui-sdk resolve transitively) + tmux, and leads the catalog with
  # the Omnigent session. Set to "false" to opt out (air-gapped events, or to
  # offer bare claude/codex only).
  - name: OMNIGENT_ENABLED
    value: "true"
  # Optional one-line version pin for an event (empty = track latest from
  # PyPI). A pinned version short-circuits reinstall via the installer's
  # version stamp; unpinned reinstalls each boot to stay on latest.
  # TMUX_STATIC_URL/SHA256 are pinned in code; the env overrides below exist
  # for emergencies (e.g. GitHub release unreachable).
  - name: OMNIGENT_VERSION
    value: ""
  # Escape hatch for air-gapped / pre-release installs only — NOT needed for
  # the default PyPI path. Point this at a wheel staged on the volume, an
  # internal index spec, or a git URL; sibling wheels (omnigent-client,
  # omnigent-ui-sdk) staged next to the main wheel are picked up by also
  # setting UV_FIND_LINKS to that directory.
  - name: OMNIGENT_PIP_SPEC
    value: ""
  - name: UV_FIND_LINKS
    value: ""
  - name: TMUX_STATIC_URL
    value: ""
  - name: TMUX_STATIC_SHA256
    value: ""

  # --- Limits ---
  - name: MAX_SESSIONS_PER_USER
    value: "3"
  - name: MAX_SESSIONS_GLOBAL
    value: "30"
  - name: SESSION_IDLE_TIMEOUT_SECONDS
    value: "3600"
