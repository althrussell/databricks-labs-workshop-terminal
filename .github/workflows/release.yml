name: Release runtime

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

env:
  UV_DEFAULT_INDEX: "https://pypi.org/simple"
  UV_INDEX_URL: "https://pypi.org/simple"
  UV_EXTRA_INDEX_URL: ""
  PIP_INDEX_URL: "https://pypi.org/simple"
  PIP_EXTRA_INDEX_URL: ""
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

jobs:
  public-sources:
    name: public-dependency-sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Validate sources before project dependency resolution
        run: python scripts/check_dependency_sources.py

  release:
    needs: public-sources
    name: build-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f event=push \
            -f branch=main \
            -f status=completed \
            -f per_page=100 > "${RUNNER_TEMP}/main-ci-runs.json"
          gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f event=pull_request \
            -f status=completed \
            -f per_page=50 > "${RUNNER_TEMP}/pr-ci-runs.json"
          TREE_SHA="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          export TREE_SHA
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(
              Path(os.environ["RUNNER_TEMP"], "main-ci-runs.json").read_text()
          )
          pr_response = json.loads(
              Path(os.environ["RUNNER_TEMP"], "pr-ci-runs.json").read_text()
          )
          sha = os.environ["GITHUB_SHA"]
          tree_sha = os.environ["TREE_SHA"]
          runs = response.get("workflow_runs", [])
          pr_runs = pr_response.get("workflow_runs", [])
          matched = any(
              run.get("path") == ".github/workflows/ci.yml"
              and run.get("head_sha") == sha
              and run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              for run in runs
          ) or any(
              run.get("path") == ".github/workflows/ci.yml"
              and run.get("event") == "pull_request"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and (
                  run.get("head_sha") == sha
                  or (run.get("head_commit") or {}).get("tree_id") == tree_sha
              )
              for run in pr_runs
          )
          if not matched:
              raise SystemExit(
                  f"Release blocked: no successful completed CI (ci.yml) push run "
                  f"on main exists for tagged commit {sha}. Push the commit to main, "
                  "wait for its full CI workflow to pass, then create and push the tag. "
                  "This check does not poll; rerun the tag workflow after green same-SHA CI."
              )
          PY
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Verify immutable tag checkout
        run: test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
      - name: Validate uv lock and source-deployment exports
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-group release --no-hashes --no-emit-project --output-file requirements.txt
          uv export --frozen --no-group release --no-hashes --no-emit-project --output-file requirements-dev.txt
          git diff --exit-code -- pyproject.toml uv.lock requirements.txt requirements-dev.txt
      - name: Materialize the uv-locked build environment
        run: uv sync --frozen --no-group dev --group release
      - name: Build immutable release assets and verify reproducibility
        run: |
          uv run --frozen --no-group dev --group release python scripts/build_release.py --output-dir dist --release-tag "${GITHUB_REF_NAME}" --git-sha "${GITHUB_SHA}" &
          pid_dist=$!
          uv run --frozen --no-group dev --group release python scripts/build_release.py --output-dir dist-repro --release-tag "${GITHUB_REF_NAME}" --git-sha "${GITHUB_SHA}" &
          pid_repro=$!
          wait "${pid_dist}"
          wait "${pid_repro}"
          cmp dist/workshop-terminal.pex dist-repro/workshop-terminal.pex
          cmp dist/release-manifest.json dist-repro/release-manifest.json
      - name: Smoke in clean Linux without a network
        run: scripts/smoke_release_container.sh dist
      - name: Publish PEX and manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/workshop-terminal.pex
            dist/release-manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
