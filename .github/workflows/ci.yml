name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - name: Validate requirements lock
        run: |
          uv pip compile requirements.in --output-file requirements.txt
          uv pip compile requirements-dev.in --output-file requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        env:
          npm_config_registry: "https://registry.npmjs.org/"
          npm_config_replace_registry_host: "always"
          npm_config_fetch_timeout: "60000"
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- static
          test -z "$(git status --porcelain -- static)"
