# CI — gap P1-12. On every PR and push to main: run the Python test suite, and
# type-check + build the frontend. The committed static/ drift check is wired as
# informational pre-work for P2-13 (built-in-CI); it is made blocking there once
# build determinism across runners is confirmed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
      - name: Check committed static/ is up to date (informational — P2-13)
        run: |
          if ! git diff --quiet -- static/; then
            echo "::warning::committed static/ differs from a fresh build — run 'make build-frontend' and commit. (Blocking once P2-13 lands.)"
            git diff --stat -- static/ || true
          fi
