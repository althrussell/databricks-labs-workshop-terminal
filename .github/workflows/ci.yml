# CI — gap P1-12. On every PR and push to main: run the Python test suite, and
# type-check + build the frontend. The committed static/ drift check is wired as
# informational pre-work for P2-13 (built-in-CI); it is made blocking there once
# build determinism across runners is confirmed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        # npm install (not ci) + Node 22's newer npm: `npm ci` on Node 20 hit npm's
        # "Exit handler never called!" crash, leaving node_modules incomplete.
        # That crash also recurs when the registry stalls mid-fetch, so tune npm's
        # fetch retries and wrap the install in a retry loop (clearing the cache
        # between attempts) to ride out transient registry hiccups on the runner.
        env:
          npm_config_fetch_retries: "5"
          npm_config_fetch_retry_mintimeout: "10000"
          npm_config_fetch_retry_maxtimeout: "120000"
          npm_config_fetch_timeout: "600000"
        run: |
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt"
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install failed (attempt $attempt); cleaning cache and retrying"
            npm cache clean --force || true
            rm -rf node_modules
            sleep 10
          done
          echo "npm install failed after 3 attempts"
          exit 1
      - name: Type-check
        working-directory: frontend
        # The frontend type-check is the "type checks" half of P1-12. The full
        # vite build + committed-static/ drift check is P2-13 (Sprint 9), where
        # build determinism across runners is solved.
        run: npx tsc --noEmit
