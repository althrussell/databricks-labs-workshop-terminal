name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_DEFAULT_INDEX: "https://pypi.org/simple"
  UV_INDEX_URL: "https://pypi.org/simple"
  UV_EXTRA_INDEX_URL: ""
  PIP_INDEX_URL: "https://pypi.org/simple"
  PIP_EXTRA_INDEX_URL: ""
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

jobs:
  public-sources:
    name: public-dependency-sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Validate sources before project dependency resolution
        run: python scripts/check_dependency_sources.py

  backend:
    needs: public-sources
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Validate uv lock and source-deployment exports
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-group release --no-hashes --no-emit-project --output-file requirements.txt
          uv export --frozen --no-group release --no-hashes --no-emit-project --output-file requirements-dev.txt
          git diff --exit-code -- pyproject.toml uv.lock requirements.txt requirements-dev.txt
      - name: Install dependencies
        run: uv sync --frozen --no-group release
      - name: Run tests
        run: uv run --frozen --no-group release python -m pytest tests/ -q

  quality-toolchain:
    needs: public-sources
    name: latest-evaluator-api-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Validate optional evaluator APIs without workspace access
        run: uv run --frozen --only-group quality python scripts/check_quality_toolchain.py

  frontend:
    needs: public-sources
    name: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        env:
          npm_config_registry: "https://registry.npmjs.org/"
          npm_config_replace_registry_host: "always"
          npm_config_fetch_timeout: "60000"
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- static
          test -z "$(git status --porcelain -- static)"

  agentbricks-toolchain:
    needs: public-sources
    name: agentbricks-cli-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Qualify actual Linux installer and offline project lifecycle
        run: uv run --frozen --no-group release python scripts/check_agentbricks_toolchain.py --bootstrap

  impeccable-delivery:
    needs: public-sources
    name: impeccable-supported-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Verify pinned bundle, supported install and native launcher
        run: uv run --frozen --no-group release python scripts/refresh_impeccable.py --check

  apx-toolchain:
    needs: public-sources
    name: apx-ubuntu22-scaffold-build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Verify official skill and real compatible installer, MCP and build
        run: |
          uv run --frozen --no-group release python scripts/refresh_apx.py --check
          uv run --frozen --no-group release python scripts/check_apx_toolchain.py --bootstrap

  package:
    needs: public-sources
    name: packaged-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Materialize the uv-locked build environment
        run: uv sync --frozen --no-group dev --group release
      - name: Build the release twice
        run: |
          uv run --frozen --no-group dev --group release python scripts/build_release.py --output-dir dist --git-sha "${GITHUB_SHA}"
          uv run --frozen --no-group dev --group release python scripts/build_release.py --output-dir dist-repro --git-sha "${GITHUB_SHA}"
      - name: Verify byte reproducibility
        run: |
          cmp dist/workshop-terminal.pex dist-repro/workshop-terminal.pex
          cmp dist/release-manifest.json dist-repro/release-manifest.json
      - name: Smoke in clean Linux without a network
        run: scripts/smoke_release_container.sh dist
      - name: Publish CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: workshop-terminal-${{ github.sha }}
          path: |
            dist/workshop-terminal.pex
            dist/release-manifest.json
            dist/release-benchmark.json
          if-no-files-found: error
          retention-days: 7

  wizard-browser:
    needs: public-sources
    name: rendered-wizard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - name: Install locked WT and pinned browser test dependencies
        run: |
          uv sync --frozen --no-group release
          uv pip install --python .venv/bin/python -r evals/generated_apps/requirements-browser.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise the committed WT wizard and project flows with local API fixtures
        env:
          WORKSHOP_E2E_BROWSER_TESTS: "1"
        run: .venv/bin/python -m pytest tests/test_wizard_rendered.py tests/test_projects_rendered.py tests/test_workshop_lifecycle_rendered.py -q
